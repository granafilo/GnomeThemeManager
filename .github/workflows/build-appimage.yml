name: Build AppImage

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyGObject and GTK build dependencies
        # System dependencies required to build and run PyGObject with GTK4/Libadwaita
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            python3-dev \
            python3-venv \
            gobject-introspection \
            libgirepository-2.0-dev \
            libcairo2-dev \
            gir1.2-girepository-3.0 \
            gir1.2-gtk-4.0 \
            libgtk-4-dev \
            libadwaita-1-dev \
            xvfb

      - name: Verify GObject Introspection dependencies
        run: |
          set -euxo pipefail
          pkg-config --modversion gobject-introspection-1.0
          pkg-config --modversion girepository-2.0
          pkg-config --modversion gtk4
          pkg-config --modversion libadwaita-1
          pkg-config --variable pc_path pkg-config

      - name: Upgrade Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies and dev tools
        run: |
          python -m pip install -e .[dev]

      - name: Verify PyGObject installation
        run: |
          python -c "import gi; print(gi.__version__)"
          python -c "import gi; gi.require_version('Gtk', '4.0'); from gi.repository import Gtk; print(Gtk.MAJOR_VERSION)"

      - name: Run version coherence check
        run: python3 scripts/check_version_coherence.py

      - name: Run Ruff lint check
        run: ruff check src tests

      - name: Run Ruff format check
        run: ruff format --check src tests

      - name: Run pytest
        run: xvfb-run -a pytest -v

  build-appimage:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyGObject and GTK build dependencies
        # System dependencies required to build and run PyGObject with GTK4/Libadwaita
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            python3-dev \
            python3-venv \
            gobject-introspection \
            libgirepository-2.0-dev \
            libcairo2-dev \
            gir1.2-girepository-3.0 \
            gir1.2-gtk-4.0 \
            libgtk-4-dev \
            libadwaita-1-dev \
            xvfb

      - name: Verify GObject Introspection dependencies
        run: |
          set -euxo pipefail
          pkg-config --modversion gobject-introspection-1.0
          pkg-config --modversion girepository-2.0
          pkg-config --modversion gtk4
          pkg-config --modversion libadwaita-1
          pkg-config --variable pc_path pkg-config

      - name: Upgrade Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          python -m pip install -e .

      - name: Verify PyGObject installation
        run: |
          python -c "import gi; print(gi.__version__)"
          python -c "import gi; gi.require_version('Gtk', '4.0'); from gi.repository import Gtk; print(Gtk.MAJOR_VERSION)"

      - name: Install appimagetool
        run: |
          sudo curl -sLO "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          sudo chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

      - name: Make build script executable
        run: chmod +x scripts/build-appimage.sh

      - name: Build AppImage package
        run: ./scripts/build-appimage.sh

      - name: Display generated AppImage details
        run: |
          ls -la dist/
          echo "AppImage Size:"
          du -h dist/*.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GNOMEThemeManager-x86_64.AppImage
          path: dist/*.AppImage
          retention-days: 14

      - name: Upload AppImage to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
