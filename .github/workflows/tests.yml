name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pytest + Ruff (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyGObject and GTK build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            python3-dev \
            python3-venv \
            gobject-introspection \
            libgirepository-2.0-dev \
            libcairo2-dev \
            gir1.2-girepository-3.0 \
            gir1.2-gtk-4.0 \
            libgtk-4-dev \
            libadwaita-1-dev \
            xvfb

      - name: Verify GObject Introspection dependencies
        run: |
          set -euxo pipefail
          pkg-config --modversion gobject-introspection-1.0
          pkg-config --modversion girepository-2.0
          pkg-config --modversion gtk4
          pkg-config --modversion libadwaita-1
          pkg-config --variable pc_path pkg-config

      - name: Upgrade Python build tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install package with dev extras
        run: python -m pip install -e .[dev]

      - name: Verify PyGObject installation
        run: |
          python -c "import gi; print(gi.__version__)"
          python -c "import gi; gi.require_version('Gtk', '4.0'); from gi.repository import Gtk; print(Gtk.MAJOR_VERSION)"

      - name: Check version coherence across repo and docs
        run: python scripts/check_version_coherence.py

      - name: Run Ruff lint
        run: ruff check src tests

      - name: Run Ruff format check
        run: ruff format --check src tests

      - name: Run pytest
        run: xvfb-run -a pytest -v