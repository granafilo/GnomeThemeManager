<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente Blu Full-Bleed (Top #3F8AE0 -> Bottom #1C5AA6) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3F8AE0"/>
      <stop offset="100%" stop-color="#1C5AA6"/>
    </linearGradient>

    <!-- Gradienti Palette Colorata -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d32d"/>
      <stop offset="100%" stop-color="#ff7800"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ec27e"/>
      <stop offset="100%" stop-color="#15a05c"/>
    </linearGradient>
    <linearGradient id="accentGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e01b24"/>
      <stop offset="100%" stop-color="#c01c28"/>
    </linearGradient>

    <!-- Ombra Soft -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 1. Sfondo Pieno Full-Bleed (Nessun angolo trasparente o scacchiera) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Bordo Superiore di Riflesso Lucido -->
  <rect x="0" y="0" width="512" height="512" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- 2. Glifo Finestra UI / Designer Temi -->
  <rect x="80" y="88" width="352" height="336" rx="40" ry="40" fill="#ffffff" fill-opacity="0.15" />

  <!-- Header Bar Finestra Desktop -->
  <path d="M 80 128 C 80 105.9 97.9 88 120 88 L 392 88 C 414.1 88 432 105.9 432 128 L 432 152 L 80 152 Z" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="116" cy="120" r="10" fill="#ed333b" />
  <circle cx="148" cy="120" r="10" fill="#f6d32d" />
  <circle cx="180" cy="120" r="10" fill="#57e389" />

  <!-- Palette Swatches Colori -->
  <circle cx="144" cy="232" r="32" fill="url(#accentGrad1)" filter="url(#dropShadow)" />
  <circle cx="256" cy="232" r="32" fill="url(#accentGrad2)" filter="url(#dropShadow)" />
  <circle cx="368" cy="232" r="32" fill="url(#accentGrad3)" filter="url(#dropShadow)" />

  <!-- Barra Slider Temi 1 -->
  <rect x="120" y="304" width="272" height="20" rx="10" fill="#ffffff" fill-opacity="0.25" />
  <rect x="120" y="304" width="160" height="20" rx="10" fill="#ffffff" />
  <circle cx="280" cy="314" r="18" fill="#ffffff" filter="url(#dropShadow)" />

  <!-- Barra Slider Temi 2 -->
  <rect x="120" y="356" width="272" height="20" rx="10" fill="#ffffff" fill-opacity="0.25" />
  <rect x="120" y="356" width="210" height="20" rx="10" fill="#ffffff" />
  <circle cx="330" cy="366" r="18" fill="#ffffff" filter="url(#dropShadow)" />
</svg>
