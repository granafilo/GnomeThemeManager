app-id: io.github.granafilo.ThemeManager
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: gnome-theme-manager

finish-args:
  # Display & Graphics
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

  # Network (for Online Theme Store / Pling & OpenDesktop integration)
  - --share=network

  # D-Bus & Settings Synchronization (GSettings / dconf / GNOME Shell)
  - --filesystem=xdg-run/dconf
  - --filesystem=xdg-config/dconf
  - --filesystem=~/.config/dconf
  - --talk-name=ca.desrt.dconf
  - --talk-name=org.gnome.Shell.Extensions
  - --talk-name=org.gnome.Shell
  - --env=GIO_EXTRA_MODULES=/app/lib/gio/modules

  # Scoped Theme & Desktop File System Permissions
  - --filesystem=xdg-data/themes:create
  - --filesystem=xdg-data/icons:create
  - --filesystem=~/.themes:create
  - --filesystem=~/.icons:create
  - --filesystem=xdg-data/gnome-shell/extensions:ro
  - --filesystem=xdg-config/gtk-4.0:create
  - --filesystem=xdg-config/gtk-3.0:create
  - --filesystem=xdg-config/gnome-theme-manager:create
  - --filesystem=~/.local/state/gnome-theme-manager:create
  - --filesystem=xdg-data/fonts:create
  - --filesystem=~/.fonts:create
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-data/flatpak:create
  - --filesystem=~/.local/share/flatpak:create
  - --filesystem=/var/lib/flatpak:ro
  - --filesystem=/var/lib/snapd:ro
  - --filesystem=/snap:ro
  - --filesystem=~/snap:ro

modules:
  - name: dconf
    buildsystem: meson
    config-opts:
      - -Dbash_completion=false
      - -Dman=false
      - -Dvapi=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/dconf/0.40/dconf-0.40.0.tar.xz
        sha256: cf7f22a4c9200421d8d3325c5c1b8b93a36843650c9f95d6451e20f0bcb24533

  - name: python3-dependencies
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --prefix=/app certifi-2026.7.22-py3-none-any.whl
      - pip3 install --no-deps --prefix=/app charset_normalizer-3.5.1-py3-none-any.whl
      - pip3 install --no-deps --prefix=/app idna-3.19-py3-none-any.whl
      - pip3 install --no-deps --prefix=/app urllib3-2.7.0-py3-none-any.whl
      - pip3 install --no-deps --prefix=/app requests-2.34.2-py3-none-any.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/0b/a7/71ac2cff56fec219ed242bb11b8efb69fcc4bec75db06fb7bfe35de520e6/certifi-2026.7.22-py3-none-any.whl
        sha256: 62f22742b58a1a33014a2b6b706588a8d7e2a88ae7bd1a6ebe8c992928483775

      - type: file
        url: https://files.pythonhosted.org/packages/cc/61/d01fc49b8dea277640b55a9e15960dbca9fdc8c9fde18e572d39c59f4019/charset_normalizer-3.5.1-py3-none-any.whl
        sha256: 6df0ec430f9a831772c23ca5a224cba36517a58a84bb32c32bb59a9fa67c47f6

      - type: file
        url: https://files.pythonhosted.org/packages/57/b0/0e52c878c53f245edd3a11020f20979b3f490f245af532c7cae3027754b5/idna-3.19-py3-none-any.whl
        sha256: 815e7be7a7806d54abb586dc943addc79e8b2ee16915059658cbeff4b1b43bf4

      - type: file
        url: https://files.pythonhosted.org/packages/7f/3e/5db95bcf282c52709639744ca2a8b149baccf648e39c8cc87553df9eae0c/urllib3-2.7.0-py3-none-any.whl
        sha256: 9fb4c81ebbb1ce9531cce37674bbc6f1360472bc18ca9a553ede278ef7276897

      - type: file
        url: https://files.pythonhosted.org/packages/a0/f4/c67b0b3f1b9245e8d266f0f112c500d50e5b4e83cb6f3b71b6528104182a/requests-2.34.2-py3-none-any.whl
        sha256: 2a0d60c172f83ac6ab31e4554906c0f3b3588d37b5cb939b1c061f4907e278e0

  - name: gnome-theme-manager
    buildsystem: simple
    build-commands:
      - python3 scripts/compile_translations.py
      - pip3 install --no-deps --no-build-isolation --prefix=/app .
      - install -Dm644 data/desktop/io.github.granafilo.ThemeManager.desktop /app/share/applications/io.github.granafilo.ThemeManager.desktop
      - install -Dm644 data/metainfo/io.github.granafilo.ThemeManager.metainfo.xml /app/share/metainfo/io.github.granafilo.ThemeManager.metainfo.xml
      - mkdir -p /app/share/icons/hicolor
      - cp -r data/icons/hicolor/* /app/share/icons/hicolor/
      - mkdir -p /app/share/gnome-theme-manager/data/icons
      - cp -r data/icons/* /app/share/gnome-theme-manager/data/icons/
      - update-desktop-database /app/share/applications
      - gtk-update-icon-cache -q -t -f /app/share/icons/hicolor
      - mkdir -p /app/share/glib-2.0/schemas
      - install -Dm644 data/schemas/org.gnome.shell.extensions.user-theme.gschema.xml /app/share/glib-2.0/schemas/
      - glib-compile-schemas /app/share/glib-2.0/schemas
    sources:
      - type: dir
        path: ..
